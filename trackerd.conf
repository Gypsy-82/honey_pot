# Nginx reverse proxy for trackerd
#
# Deploy:
#   sudo cp deploy/nginx/trackerd.conf /etc/nginx/sites-available/trackerd
#   sudo ln -s /etc/nginx/sites-available/trackerd /etc/nginx/sites-enabled/trackerd
#   sudo nginx -t && sudo systemctl restart nginx
#
# Then start trackerd bound to localhost:
#   TRACKERD_HOST=https://your-ngrok-or-domain.com ./trackerd serve

server {
    listen 80;
    listen [::]:80;

    # Replace with your ngrok domain, VPS domain, or _ to match all
    server_name _;

    # Increase timeouts for slow target sites being proxied
    proxy_connect_timeout  30s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    # Pass all traffic to trackerd
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Forward the real attacker IP — trackerd reads X-Forwarded-For
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass the original Host header through
        proxy_set_header   Host             $host;

        # Required for sendBeacon / CORS preflight from injected JS
        proxy_set_header   Connection       "";

        # Do not buffer — trackerd streams proxied responses directly
        proxy_buffering    off;
    }

    # Hide that this is a proxy server
    server_tokens off;
    proxy_hide_header X-Powered-By;
}

